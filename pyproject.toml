[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccsf-con"
version = "0.6"
description = """
  Python package with common functions and procedures for developers
"""
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "clin94118", email = "clin@ccsf.edu" },
]
maintainers = [
  { name = "clin94118", email = "clin@ccsf.edu" },
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "oracledb==2.3.0",
    "pandas==2.2.2",
    "pytest==8.3.2",
    "requests==2.32.3",
    "sqlalchemy==2.0.32",
    "codetiming==1.4.0",
    "configparser==5.2.0",
    "google-api-python-client==2.161.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.1",
]




[project.urls]
Documentation = "https://github.com/clin94118/ccsf-con#readme"
Issues = "https://github.com/clin94118/ccsf-con/issues"
Source = "https://github.com/clin94118/ccsf-con"

[tool.hatch.version]
path = "src/ccsf_con/__about__.py"
